framework: "ISO 27001"
version: "2022"
controls:
  - id: "A.5.1"
    name: "Policies for Information Security"
    description: "Information security policy and topic-specific policies should be defined."
    criticality: "High"
    category: "Governance"
    verification_type: "Manual"
    
  - id: "A.8.1"
    name: "User Endpoint Devices"
    description: "Information stored on, processed by or accessible via user endpoint devices shall be protected."
    criticality: "High"
    category: "Technical"
    verification_type: "Automatic"
    checks:
      - registry_key: "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System"
        value_name: "EnableLUA"
        expected: 1
        
  - id: "A.12.1"
    name: "Operational Procedures and Responsibilities"
    description: "Operational procedures should be documented and made available to users."
    criticality: "Medium"
    category: "Operational"
    verification_type: "Manual"

  - id: "A.13.1"
    name: "Network Security Management"
    description: "Networks and network services shall be secured, managed and controlled."
    criticality: "High"
    category: "Technical"
    verification_type: "Automatic"
    checks:
      - service_status: "MpsSvc" # Windows Firewall
        expected: "Running"
